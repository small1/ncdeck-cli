[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncdeck"
version = "0.2.0"
description = "CLI tool to create cards in Nextcloud Deck"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ncdeck"},
]
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.scripts]
ncdeck = "ncdeck.main:main"

[project.urls]
Homepage = "https://github.com/example/ncdeck"

[tool.setuptools.packages.find]
where = ["src"]
