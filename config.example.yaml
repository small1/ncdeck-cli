# ~/.config/ncdeck/config.yaml
# Example configuration for ncdeck

# Instance to use if none is specified with -i/--instance
default_instance: work

instances:
  work:
    url: https://nextcloud.example.com  # Required. No trailing slash
    username: alice                    # Required. Your Nextcloud username
    password: app-password-here        # Required. Use an App Password
    verify: true                      # Optional. Set to false for self-signed certificates (use with caution)
    color: cyan                       # Optional. Theme color for this instance's output (e.g. cyan, blue, magenta, green, yellow)
    boards:
      inbox:
        board_id: 1
        stack_id: 5
        done_stack_id: 10            # Optional: Stack to move completed cards to
      bugs:
        board_id: 2
        stack_id: 9
        done_stack_id: 11
      reviews:
        board_id: 3
        stack_id: 12

  personal:
    url: https://cloud.personal.example
    username: bob
    password: another-app-password
    boards:
      ideas:
        board_id: 4
        stack_id: 7
        done_stack_id: 8
      todo:
        board_id: 5
        stack_id: 11
